name: tutorial1
on: push
jobs:
    job1:
        name: job1
        runs-on: ubuntu-latest
        steps:
        - name: setup-python
          uses: actions/setup-python@v6
          with:
              python-version: "3.12"
        - name: check-version
          run: python --version 
    job2:
        name: job2
        runs-on: windows-latest
        steps:
        - name: step2
          run: echo "hello from job2"
    job3:
        name: job3
        runs-on: ubuntu-latest
        steps:
        - name: step 3
          run: echo "Hello from job3"
        - name: Step 1 - Generate the variable
          run: |
            # Calculate a dynamic value
            BUILD_TAG="prod-build-${{ github.run_number }}"
          
            # Write it to the global environment file
            echo "MY_SHARED_TAG=$BUILD_TAG" >> $GITHUB_ENV

        - name: Step 2 - Use the variable naturally
          run: |
            # Access it just like any regular environment variable
            echo "The tag created in step 1 is: $MY_SHARED_TAG"


