name: CI

on: 
  workflow_dispatch

jobs:
  MLModelWorkflow:
  
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./ModelCleaning
    steps:
      - name: Setup python3.10 
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Setup code repo
        uses: actions/checkout@v4
      - name: Clean Data
        run: |
          pip3 install pandas joblib scikit-learn  
          python Cleandata.py
          ls -l
      - name: Train Model
        run: |
          python train_test_dataset.py
          ls -l
