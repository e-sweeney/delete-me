name: CI

on: 
  workflow_dispatch

jobs:
  MLModelWorkflow:
  
    runs-on: ubuntu-latest
    steps:
      - name: Setup python3.10 
        uses: actions/python@v6
        with:
          python-version: 3.10

      - name: Setup code repo
        uses: actions/checkout@v4
        run: |
          python --version
          pip --version

      - name: Clean Data
        run: |
          cd ModelCleaning
          pip3 install pandas joblib scikit-learn  
          python Cleandata.py
